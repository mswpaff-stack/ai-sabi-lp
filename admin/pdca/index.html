<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-SABI 問い合わせ営業PDCA</title>
    <link rel="stylesheet" href="./styles.css?v=20260504-results-refresh" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" aria-label="メインナビゲーション">
        <a class="brand" href="#dashboard" aria-label="AI-SABI ダッシュボード">
          <span class="brand-mark icon icon-building" aria-hidden="true"></span>
          <span class="brand-text">AI-SABI</span>
        </a>

        <nav class="side-nav" id="sideNav"></nav>

        <section class="user-card" aria-label="ユーザー">
          <span class="avatar">落</span>
          <span class="user-meta">
            <strong>落合</strong>
            <small>ユーザー</small>
          </span>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">OUTREACH PDCA</p>
            <h1 id="pageTitle">問い合わせ営業PDCA</h1>
            <p id="pageLead" class="lead">配信結果とトラッキング補正値を整理します。</p>
          </div>
          <div class="top-actions">
            <button class="ghost-button" type="button" id="syncButton">
              <span class="icon icon-sync" aria-hidden="true"></span>
              既存ツール数値を同期
            </button>
            <button class="ghost-button" type="button" id="analysisButton">
              <span class="icon icon-improve" aria-hidden="true"></span>
              AI分析を実行
            </button>
            <button class="primary-button" type="button" id="createButton">
              <span class="icon icon-ab" aria-hidden="true"></span>
              新規テスト案を作成
            </button>
            <div class="date-pill">
              <span class="icon icon-calendar" aria-hidden="true"></span>
              2026/05/04（月）
            </div>
          </div>
        </header>

        <section id="viewRoot" class="view-root"></section>
      </main>
    </div>

    <dialog class="modal" id="actionModal">
      <form method="dialog" class="modal-card">
        <div class="modal-head">
          <span class="modal-icon icon icon-warning" aria-hidden="true"></span>
          <div>
            <h2 id="modalTitle">確認</h2>
            <p id="modalLead">操作内容を確認してください。</p>
          </div>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions">
          <button class="ghost-button" value="cancel">閉じる</button>
          <button class="primary-button" value="confirm" id="modalConfirm">実行する</button>
        </div>
      </form>
    </dialog>

    <script src="./data.js?v=20260504-results-refresh"></script>
    <script src="./app.js?v=20260504-results-refresh"></script>
  </body>
</html>
